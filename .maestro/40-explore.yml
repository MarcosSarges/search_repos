appId: host.exp.Exponent
name: Explore trending → details
tags:
  - p1
  - explore
---
- runFlow: shared/boot.yml
- tapOn: Explore
- extendedWaitUntil:
    visible:
      id: explore-screen
    timeout: 15000
    label: E2E-14 — Explore screen
- extendedWaitUntil:
    visible:
      id: explore-list
    timeout: 60000
    label: E2E-15 — Explore trending list
- tapOn:
    id: repo-list-item
    index: 0
    label: Open first trending repo
- extendedWaitUntil:
    visible:
      id: repo-details-content
    timeout: 60000
    label: E2E-16 — details from Explore
- tapOn:
    id: ds-back-header-back
    optional: true
    label: Pop details if stack back present
- tapOn: Explore
- assertVisible:
    id: explore-screen
    label: E2E-17 — Explore reachable again
